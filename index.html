  <body class="bg-slate-100 text-slate-900 selection:bg-primary-200">
    <script>
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && event.reason.message && event.reason.message.includes('WebSocket')) {
          event.preventDefault();
        }
      });
      const originalError = console.error;
      console.error = function(...args) {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('failed to connect to websocket')) {
          return;
        }
        originalError.apply(console, args);
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
